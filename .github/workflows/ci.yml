name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    # Windows only, and not for show: the module builds Win32 structures and
    # touches user32 at import time, so it cannot even be imported elsewhere.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # Hardware tests are deselected by pyproject.toml: a runner has no
        # microphone, no tray, and no whisper.dll. They run on a real desktop
        # with `pytest -m hardware`.
        run: pytest -q
